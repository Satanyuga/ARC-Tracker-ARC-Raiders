<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>ARC Raiders — события на карте</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2e38;--tx:#f2ede4;--mut:#8b919d;--ok:#4ade80;--acc:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 12px calc(90px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin:0 -12px;padding-left:12px;padding-right:12px}
h1{font-size:17px;margin:0}
#clock{color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px}
section{margin-top:18px;scroll-margin-top:56px}
h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.card{position:relative;overflow:hidden;padding-bottom:16px!important;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.card img{width:44px;height:44px;object-fit:contain;flex:none}
.ph{width:44px;height:44px;border-radius:50%;background:var(--line);flex:none}
.inf{flex:1;min-width:0}
.nm{font-weight:700}
.mp{color:var(--mut);font-size:13px}
.tm{text-align:right;font-size:12px;color:var(--mut);flex:none}
.tm b{display:block;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ok)}
.tm b.w{color:var(--tx)}
.hr{position:sticky;top:48px;background:var(--bg);padding:6px 0;margin:10px 0 6px;font-weight:700;color:var(--acc);display:flex;justify-content:space-between;z-index:2;scroll-margin-top:90px}
.hr small{color:var(--mut);font-weight:400}
.past{opacity:.4}
.bar{position:absolute;left:12px;right:12px;bottom:6px;height:4px;border-radius:4px;background:#2a2e38;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#16a34a,#4ade80);transition:width 1s linear}
#gear{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;width:38px;height:34px;font-size:18px;margin-left:10px}
#hd{display:flex;align-items:center}
#panel{display:none;position:absolute;right:12px;top:52px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:20;min-width:200px;box-shadow:0 8px 24px #000b}
#panel.open{display:block}
#panel b{display:block;color:var(--mut);font-size:12px;margin-bottom:6px;font-weight:400}
#panel label{display:flex;gap:10px;align-items:center;padding:9px 4px;font-size:15px}
#panel input{accent-color:var(--acc);width:18px;height:18px}
.gh{display:flex;align-items:center;gap:10px;position:sticky;top:48px;background:var(--bg);padding:8px 0;margin:10px 0 6px;font-weight:700;z-index:2;color:var(--acc)}
.gh img{width:28px;height:28px;object-fit:contain}
.gh small{margin-left:auto;color:var(--mut);font-weight:400}
.cur .hr{color:var(--ok)}
.pin{margin-left:auto;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px}
.pin.on{background:var(--acc);color:#000;border-color:var(--acc)}
#upc{position:fixed;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:9;background:var(--acc);color:#000;border:0;border-radius:999px;padding:14px 18px;font:700 15px system-ui;box-shadow:0 4px 16px #000a}
#anchor{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:9;background:var(--ok);color:#000;border:0;border-radius:999px;padding:14px 18px;font:700 15px system-ui;box-shadow:0 4px 16px #000a}
.empty{color:var(--mut);padding:8px 0}
#st{color:var(--mut);font-size:12px;margin-top:20px;text-align:center}
</style>
</head>
<body>
<header><h1>События на карте</h1><div id="hd"><span id="clock"></span><button id="gear" aria-label="Сортировка">⚙</button></div>
<div id="panel"><b>Сортировать по</b><label><input type="radio" name="sm" value="time">времени</label><label><input type="radio" name="sm" value="event">событиям</label><label><input type="radio" name="sm" value="map">картам</label></div></header>

<section id="now"><h2><span class="dot"></span>Идут сейчас</h2><div id="nowList"></div></section>
<section id="next"><h2>Следующий час</h2><div id="nextList"></div></section>
<section id="day"><h2>Ближайшие 24 часа <button class="pin" id="pin">Убрать прошедшие</button></h2><div id="dayList"></div></section>
<div id="st"></div>
<button id="anchor">● Сейчас</button>
<button id="upc">Ожидаются ↓</button>

<script>
// ===== НАСТРОЙКИ =====
const PROXY = "https://sparkling-night-fe27.satanyugav.workers.dev/"; // сюда вставь адрес своего Worker, например "https://arc-events.ИМЯ.workers.dev"
const API = PROXY || "https://metaforge.app/api/arc-raiders/events-schedule"; // источник данных (MetaForge)
const ICON = "https://cdn.arctracker.io/map-events/";
const EV = { // англ. → [ру, иконка]
 "hurricane":["Ураган","hurricane"],"night raid":["Ночной рейд","night_raid"],
 "electromagnetic storm":["Электромагнитная буря","electromagnetic_storm"],"cold snap":["Похолодание","cold_snap"],
 "locked gate":["Запертые ворота","locked_gate"],"hidden bunker":["Скрытый бункер","hidden_bunker"],
 "matriarch":["Матриарх","matriarch"],"harvester":["«Сборщик»","harvester"],"lush blooms":["Пышное цветение","lush_blooms"],
 "prospecting probes":["Геологические зонды","prospecting_probes"],"husk graveyard":["Кладбище обломков","husk_graveyard"],
 "uncovered caches":["Неоткрытые тайники","uncovered_caches"],"launch tower loot":["Лут стартовой вышки","launch_tower_loot"],
 "bird city":["Птичий город","bird_city"],"arc frigate":["«Фрегат» ARC","arc_frigate"],"close scrutiny":["Тщательная проверка","close_scrutiny"],"redirection":["Перенаправление","redirection"],"beachcombing":["Прочёсывание пляжа","beachcombing"]
};
const MP = {"dam":"Поле битвы у дамбы","dam battleground":"Поле битвы у дамбы","dam battlegrounds":"Поле битвы у дамбы",
 "spaceport":"Космопорт","the spaceport":"Космопорт","buried city":"Погребённый город","blue gate":"Синие ворота",
 "stella montis":"Стелла Монтис","pendola pass":"Перевал Пендола","riven tides":"Riven Tides"};
// ======================

function ie(i){const f=i.src.split("/").pop();if(!i.dataset.l&&f){i.dataset.l=1;i.src="icons/"+f}else i.replaceWith(Object.assign(document.createElement("div"),{className:"ph"}))}
const H=3600e3, $=s=>document.querySelector(s);
let events=[], live=false, lastSig="", seenUp=false, sortMode="time";
try{const v=localStorage.getItem("sm");if(["time","event","map"].includes(v))sortMode=v}catch(e){}
const pad=n=>String(n).padStart(2,"0");
const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())};
function fmt(ms){ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;
 return (h?h+"ч ":"")+pad(m)+"м "+pad(s)+"с"}

function norm(raw){
 const out=[], now=Date.now();
 const list=Array.isArray(raw)?raw:(raw.data||raw.events||[]);
 for(const e of list){
  const en=String(e.name||e.event||"").trim(), key=en.toLowerCase();
  const m=String(e.map||"").trim(), mk=m.toLowerCase();
  const ev=EV[key];
  const icon=e.icon||(ev?ICON+ev[1]+".png":"");
  for(const t of (e.times||[{start:e.startTime,end:e.endTime}])){
   const mk2=(s,off)=>{ // "HH:MM" UTC + смещение дней
    if(typeof s==="number") return s<1e12?s*1e3:s;
    if(/^\d{1,2}:\d{2}/.test(s)){const [h,mi]=s.split(":").map(Number);const d=new Date();
     return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+off,h,mi)}
    return Date.parse(s)};
   for(const off of [-1,0,1,2]){
    let a=mk2(t.start,off), b=mk2(t.end,off);
    if(isNaN(a)||isNaN(b)) continue;
    if(b<=a) b+=24*H;
    if(!(typeof t.start==="string"&&/^\d{1,2}:\d{2}$/.test(t.start))&&off!==0) continue; // абсолютное время — один раз
    if(b>now-4*H&&a<now+25*H) out.push({name:ev?ev[0]:en,map:MP[mk]||m,icon,start:a,end:b});
   }
  }
 }
 return out.sort((x,y)=>x.start-y.start);
}

function demo(){ // запасной вариант, если API недоступен
 const base=Math.floor(Date.now()/H)*H-4*H, names=Object.keys(EV), maps=["Blue Gate","Stella Montis","Dam","Spaceport","Buried City"], out=[];
 for(let i=0;i<30;i++){const s=base+i*H;
  for(let k=0;k<4;k++){const n=names[(i*3+k*5)%names.length];
   out.push({name:EV[n][0],map:MP[maps[(i+k*2)%5].toLowerCase()],icon:ICON+EV[n][1]+".png",start:s,end:s+(k%2?1:2)*H})}}
 return out;
}

const bar=e=>{const p=Math.min(100,Math.max(0,(Date.now()-e.start)/(e.end-e.start)*100));return `<div class="bar"><i data-s="${e.start}" data-e="${e.end}" style="width:${p}%"></i></div>`};
const card=(e,mode)=>{
 const now=Date.now();
 let right="";
 if(mode==="now") right=`<div class="tm">Закончится через<b data-t="${e.end}">${fmt(e.end-now)}</b></div>`;
 else if(mode==="next") right=`<div class="tm">Начнётся через<b class="w" data-t="${e.start}">${fmt(e.start-now)}</b></div>`;
 else right=`<div class="tm">${hhmm(e.start)}–${hhmm(e.end)}<b class="w">${Math.round((e.end-e.start)/H)} ч</b></div>`;
 return `<div class="card">${e.icon?`<img src="${e.icon}" alt="" onerror="ie(this)">`:'<div class="ph"></div>'}
 <div class="inf"><div class="nm">${e.name}</div><div class="mp">${e.map}</div></div>${right}${mode==="now"?bar(e):""}</div>`};

const rel=ms=>ms<=0?"сейчас":"через "+fmt(ms).replace(/ \d+с$/,"");
const imgOf=e=>e.icon?`<img src="${e.icon}" alt="" onerror="ie(this)">`:'<div class="ph"></div>';
const row=(e,title)=>{const now=Date.now(),act=e.start<=now&&e.end>now,past=e.end<=now;
 return `<div class="card ${past?"past":""}">${imgOf(e)}<div class="inf"><div class="nm">${title}</div><div class="mp">${act?"идёт сейчас":past?"было":rel(e.start-now)}</div></div><div class="tm">${hhmm(e.start)}–${hhmm(e.end)}<b class="w">${Math.round((e.end-e.start)/H)} ч</b></div>${act?bar(e):""}</div>`};
const cmp={time:null,event:(a,b)=>a.name.localeCompare(b.name,"ru")||a.start-b.start||a.end-b.end,map:(a,b)=>a.map.localeCompare(b.map,"ru")||a.start-b.start||a.end-b.end};
function render(force){
 const now=Date.now(), hs=Math.floor(now/H)*H;
 const nowL=events.filter(e=>e.start<=now&&e.end>now).sort((a,b)=>a.end-b.end);
 const nextL=events.filter(e=>e.start>now&&e.start<=now+H);
 if(cmp[sortMode]){nowL.sort(cmp[sortMode]);nextL.sort(cmp[sortMode])}
 const sig=nowL.map(e=>e.start+e.name).join()+"|"+nextL.length+"|"+hs+"|"+sortMode;
 if(sig===lastSig&&!force) return;
 const firstRender=!lastSig; lastSig=sig;
 $("#nowList").innerHTML=nowL.map(e=>card(e,"now")).join("")||'<div class="empty">Нет активных событий</div>';
 $("#nextList").innerHTML=nextL.map(e=>card(e,"next")).join("")||'<div class="empty">Нет событий</div>';
 // 24 часа: группы по часу начала (прошлые 3 ч — приглушены)
 const groups={};
 for(const e of events){const g=Math.floor(e.start/H)*H; if(g>=hs-3*H&&g<=hs+24*H)(groups[g]=groups[g]||[]).push(e)}
 if(sortMode!=="time"){
  const g2={};
  for(const e of events){if(e.start<hs-3*H||e.start>hs+24*H)continue;if(hidePast&&e.end<=now)continue;
   const k=sortMode==="event"?e.name:e.map;(g2[k]=g2[k]||[]).push(e)}
  $("#dayList").innerHTML=Object.keys(g2).sort((a,b)=>a.localeCompare(b,"ru")).map(k=>{
   const L=g2[k].sort((a,b)=>a.start-b.start||a.end-b.end);
   return `<div class="gh">${sortMode==="event"?imgOf(L[0]):""}<span>${k}</span><small>${L.length}</small></div>${L.map(e=>row(e,sortMode==="event"?e.map:e.name)).join("")}`}).join("")||'<div class="empty">Нет данных</div>';
  return;
 }
 $("#dayList").innerHTML=(()=>{seenUp=false;return Object.keys(groups).map(Number).sort((a,b)=>a-b)})().map(g=>{
  if(hidePast&&g<hs) return "";
  const cls=g<hs?"past":g===hs?"cur":"";
  const rel=g===hs?"сейчас":g<hs?"было":"через "+Math.round((g-hs)/H)+" ч";
  const up=g>=hs&&!seenUp; if(up) seenUp=true;
  return `<div class="${cls}" ${g===hs?'id="curHour"':""} ${up?'id="upHour"':""}><div class="hr"><span>${hhmm(g)}</span><small>${rel}</small></div>${groups[g].map(e=>card(e,"day")).join("")}</div>`}).join("")
  ||'<div class="empty">Нет данных</div>';
 
}
function tick(){
 const now=Date.now();
 $("#clock").textContent=hhmm(now)+":"+pad(new Date().getSeconds());
 document.querySelectorAll(".bar i").forEach(i=>{const a=+i.dataset.s,b=+i.dataset.e;i.style.width=Math.min(100,Math.max(0,(now-a)/(b-a)*100))+"%"});
 document.querySelectorAll("[data-t]").forEach(el=>el.textContent=fmt(el.dataset.t-now));
 render();
}
function goCur(smooth=true){const el=$("#curHour");if(el){const y=el.getBoundingClientRect().top+scrollY-100;scrollTo({top:y,behavior:smooth?"smooth":"auto"})}}

// якорь: прокрутка к «Идут сейчас»
$("#anchor").onclick=()=>$("#now").scrollIntoView({behavior:"smooth"});
// убрать прошедшие часы
let hidePast=false; try{hidePast=localStorage.getItem("hp")==="1"}catch(e){}
const setHP=()=>{$("#pin").classList.toggle("on",hidePast);$("#pin").textContent=hidePast?"Показать прошедшие":"Убрать прошедшие"};
$("#pin").onclick=()=>{hidePast=!hidePast;try{localStorage.setItem("hp",hidePast?"1":"0")}catch(e){};setHP();render(true)};
setHP();
// ожидаются: мгновенно к первому будущему часу сразу после прошедших/текущего
$("#upc").onclick=()=>{const el=sortMode==="time"?($("#upHour")||$("#curHour")):$("#day");if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-100,behavior:"auto"})};

// шестерёнка: сортировка (хранится в localStorage)
const setSM=()=>document.querySelectorAll('#panel input').forEach(i=>i.checked=i.value===sortMode);
setSM();
$("#gear").onclick=e=>{e.stopPropagation();$("#panel").classList.toggle("open")};
$("#panel").onclick=e=>e.stopPropagation();
document.addEventListener("click",()=>$("#panel").classList.remove("open"));
document.querySelectorAll('#panel input').forEach(i=>i.onchange=()=>{sortMode=i.value;try{localStorage.setItem("sm",sortMode)}catch(e){};$("#panel").classList.remove("open");render(true)});

async function load(){
 let why="";
 try{
  let r; try{r=await fetch(API,{cache:"no-store"})}catch(e){throw "запрос заблокирован (CORS/сеть)"}
  if(!r.ok) throw "сервер ответил "+r.status;
  let j; try{j=await r.json()}catch(e){throw "ответ не JSON"}
  const ev=norm(j); if(!ev.length) throw "формат не распознан: "+JSON.stringify(j).slice(0,200);
  events=ev; live=true;
 }catch(e){why=String(e);events=demo();live=false}
 $("#st").innerHTML=live?'':
  '⚠ Живые данные не загрузились — показано демо-расписание<br><small>Причина: '+why.replace(/</g,"&lt;")+'</small>';
 lastSig=""; render(true);
}
load(); setInterval(tick,1000); setInterval(load,10*60e3);
</script>
</body>
</html>
